# ==========================================
# Monamy - Configuración de la Aplicación
# ==========================================

# Puerto del servidor
server.port=8081

# Nombre de la aplicación
spring.application.name=Monamy

# ==========================================
# Groq API Configuration
# ==========================================
groq.api.key=${GROQ_API_KEY}
groq.api.url=https://api.groq.com/openai/v1/chat/completions
groq.api.model=${GROQ_MODEL:llama-3.1-8b-instant}
groq.api.temperature=0.7
groq.api.max-tokens=1024

# Tiempo máximo de una respuesta en streaming (/api/chat/stream)
spring.mvc.async.request-timeout=60s
